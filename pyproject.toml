[project]
name = "soundrevive"
version = "0.1.0"
description = "Research-grade benchmark for ML restoration of historical degraded audio."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 180

[tool.ruff.lint]
select = ["E", "F", "I", "W", "C", "B", "RUF"]
ignore = [
    "C408",  # dict(...) literal style — used deliberately for readability in tier param tables
]
