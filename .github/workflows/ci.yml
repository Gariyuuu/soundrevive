name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements.txt
      - name: Lint
        run: ruff check src tests
      - name: Test (tiny fixtures — SMOKE-tier corpus committed under data/raw/)
        run: pytest -q

# No frontend job yet — the Next.js site (brief §41) is not built in this repo yet.
# See docs/HANDOFF.md. Add a `site` job (lint/typecheck/build) once site/ exists.
